name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test with coverage
        run: pytest --cov=net_toolkit --cov-report=term-missing --cov-fail-under=80

      - name: Core logic coverage gate (subnet, audit, pcap > 80%)
        run: >
          coverage report --fail-under=80
          --include='src/net_toolkit/subnet.py,src/net_toolkit/audit.py,src/net_toolkit/pcap.py'

      - name: Every --demo runs offline
        env:
          NO_COLOR: "1"
        run: |
          nt subnet --demo
          nt scan --demo
          nt backup --demo
          nt diff --demo
          nt audit --demo
          nt pcap summary --demo
          nt ping-matrix --demo

      - name: Wheel bundles the demo data
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m zipfile -l dist/*.whl | grep -q 'net_toolkit/examples/sample.pcap'
