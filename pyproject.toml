[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "net-toolkit"
version = "0.1.0"
description = "Networking utilities for lab work: subnetting, sweeps, config backups, IOS audits, pcap triage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick B" }]
requires-python = ">=3.11"
keywords = ["networking", "cisco", "netmiko", "subnetting", "pcap", "cli", "network-automation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "netmiko>=4.3",
    "pyyaml>=6.0",  # already pulled in by netmiko; declared because we import it
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "scapy>=2.5"]

[project.scripts]
nt = "net_toolkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/net_toolkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["net_toolkit"]
branch = true
