# Invented lab inventory for net-toolkit examples. These addresses are made up.
#
# Passwords are never stored here: each device reads the environment variable
# named by password_env (default NT_PASSWORD) and nt prompts if it is unset.

defaults:
  username: netadmin
  password_env: NT_PASSWORD
  device_type: cisco_ios

devices:
  - name: CORE-SW1
    host: 10.10.99.1
  - name: DIST-SW2
    host: 10.10.99.12
  - name: EDGE-RTR1
    host: 10.10.0.1
  - name: NX-LEAF1
    host: 10.10.99.21
    device_type: cisco_nxos
  - name: EOS-SPINE1
    host: 10.10.99.31
    device_type: arista_eos
