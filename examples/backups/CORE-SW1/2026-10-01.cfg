!
! Invented lab config for net-toolkit examples. Not taken from any real network.
! Collapsed-core L3 switch: decent basics, sloppy trunks.
!
version 17.6
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname CORE-SW1
!
enable secret 9 $9$labOnlyFakeSalt$FakeHashValueForExamplesOnly000000000000000
!
aaa new-model
aaa authentication login default local
!
ip domain name lab.example.net
ip routing
!
username netadmin privilege 15 secret 9 $9$labOnlyFakeSalt$AnotherFakeHashForExamples00000000000000
!
ip ssh version 2
!
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 30
 name PRINTERS
vlan 99
 name MGMT
vlan 999
 name NATIVE-UNUSED
!
interface GigabitEthernet1/0/1
 description Routed link to EDGE-RTR1 Gi0/0/1
 no switchport
 ip address 10.10.0.2 255.255.255.252
 ip ospf 1 area 0
!
interface GigabitEthernet1/0/47
 description Trunk to DIST-SW2 (pruned, native moved off VLAN 1)
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport mode trunk
!
interface GigabitEthernet1/0/48
 description Trunk to closet switch (left on defaults)
 switchport mode trunk
!
interface Vlan10
 ip address 10.10.10.1 255.255.255.0
 ip ospf 1 area 0
!
interface Vlan20
 ip address 10.10.20.1 255.255.255.0
 ip ospf 1 area 0
!
interface Vlan99
 ip address 10.10.99.1 255.255.255.0
 ip ospf 1 area 0
!
router ospf 1
 router-id 10.255.0.2
 passive-interface default
 no passive-interface GigabitEthernet1/0/1
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
!
ip access-list extended OLD-GUEST
 remark guest VLAN was removed last year
 deny   ip 10.10.50.0 0.0.0.255 10.10.0.0 0.0.255.255
 permit ip 10.10.50.0 0.0.0.255 any
!
logging buffered 16384
!
snmp-server community Mon1toringRO24 RO
!
line con 0
 logging synchronous
line vty 0 4
 access-class MGMT-ONLY in
 transport input ssh
line vty 5 15
 access-class MGMT-ONLY in
 transport input ssh
!
end
