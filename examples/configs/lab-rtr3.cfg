!
! Invented lab config for net-toolkit examples. Not taken from any real network.
! Hardened branch router: the audit should come back clean.
!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname LAB-RTR3
!
enable algorithm-type scrypt secret 9 $9$labOnlyFakeSalt$FifthFakeHashForExamples00000000000000000
!
aaa new-model
aaa authentication login default local
!
ip domain name lab.example.net
!
username netadmin privilege 15 algorithm-type scrypt secret 9 $9$labOnlyFakeSalt$SixthFakeHash000000000000
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
key chain OSPF-KEYS
 key 1
  key-string 7 0000000000000000
  cryptographic-algorithm hmac-sha-256
!
interface GigabitEthernet0/0/0
 description WAN to provider (documentation range)
 ip address 198.51.100.6 255.255.255.252
 ip access-group EDGE-IN in
!
interface GigabitEthernet0/0/1
 description LAN
 ip address 10.30.10.1 255.255.255.0
 ip ospf authentication key-chain OSPF-KEYS
 ip ospf 1 area 0
!
router ospf 1
 router-id 10.255.0.3
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
!
no ip http server
no ip http secure-server
!
ip access-list standard MGMT
 permit 10.30.99.0 0.0.0.255
!
ip access-list extended EDGE-IN
 permit tcp any any established
 permit icmp any any echo-reply
 deny   ip any any log
!
logging host 10.30.99.50
logging trap informational
ntp server 10.30.99.10
ntp server 10.30.99.11
!
snmp-server group NMS v3 priv
snmp-server user nms-poller NMS v3 auth sha FakeAuthPass priv aes 128 FakePrivPass
!
line con 0
 exec-timeout 5 0
line vty 0 4
 access-class MGMT in
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 transport input none
!
end
