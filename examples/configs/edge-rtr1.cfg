!
! Invented lab config for net-toolkit examples. Not taken from any real network.
! Internet edge router with the usual "it works, ship it" problems.
!
version 16.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname EDGE-RTR1
!
boot-start-marker
boot-end-marker
!
enable password 7 0822455D0A16
!
no aaa new-model
!
ip domain name lab.example.net
!
username netadmin privilege 15 password 0 Lab-Only-Pass
!
banner motd ^C
  Authorized access only. interface Fake0 (this line is banner text, not config)
^C
!
interface GigabitEthernet0/0/0
 description WAN uplink to ISP (documentation range)
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 negotiation auto
!
interface GigabitEthernet0/0/1
 description LAN link to CORE-SW1 Gi1/0/1
 ip address 10.10.0.1 255.255.255.252
 ip nat inside
 ip ospf 1 area 0
 negotiation auto
!
router ospf 1
 router-id 10.255.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 default-information originate
!
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0/0 overload
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip http server
ip http authentication local
!
ip access-list standard NAT-INSIDE
 permit 10.10.0.0 0.0.255.255
!
ip access-list extended WAN-IN
 remark written but never applied to Gi0/0/0
 deny   ip 10.0.0.0 0.255.255.255 any
 deny   ip 172.16.0.0 0.15.255.255 any
 deny   ip 192.168.0.0 0.0.255.255 any
 permit tcp any any established
 permit icmp any any echo-reply
!
snmp-server community public RO
snmp-server community private RW
!
line con 0
 logging synchronous
line vty 0 4
 password 7 13061E010803
 login
 transport input all
!
end
