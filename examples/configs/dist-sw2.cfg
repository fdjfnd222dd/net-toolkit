!
! Invented lab config for net-toolkit examples. Not taken from any real network.
! Access/distribution switch: mostly fine, a few gaps.
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname DIST-SW2
!
enable secret 9 $9$labOnlyFakeSalt$ThirdFakeHashForExamplesOnly0000000000000
!
username netadmin privilege 15 secret 9 $9$labOnlyFakeSalt$FourthFakeHashForExamples000000000000000
!
ip domain-name lab.example.net
ip ssh version 2
!
spanning-tree mode rapid-pvst
!
interface GigabitEthernet0/1
 description Uplink to CORE-SW1 Gi1/0/47
 switchport trunk native vlan 999
 switchport trunk allowed vlan 1-30
 switchport trunk allowed vlan add 99
 switchport mode trunk
!
interface GigabitEthernet0/2
 description Desk 2-114
 switchport access vlan 10
 switchport voice vlan 20
 switchport mode access
 spanning-tree portfast
!
interface Vlan99
 ip address 10.10.99.12 255.255.255.0
!
ip default-gateway 10.10.99.1
!
access-list 15 permit 10.10.99.0 0.0.0.255
!
logging buffered 16384 informational
ntp server 10.10.99.10
!
snmp-server community Dist2ReadOnly77 RO 15
!
line con 0
line vty 0 4
 access-class 15 in
 transport input ssh
line vty 5 15
 access-class 15 in
!
end
